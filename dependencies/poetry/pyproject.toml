[tool.poetry]
name = "dependency-graph-poetry"
version = "0.1.0"
description = "Poetry fixture for the GitHub Dependency Graph"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
requests = ">=2.32,<3"
flask = ">=3.0,<4"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
